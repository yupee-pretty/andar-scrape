name: Andar Daily Scrape

on:
  schedule:
    # 매일 UTC 02:00 = 한국시간(KST) 오전 11:00
    - cron: "0 2 * * *"
  workflow_dispatch: {}   # Actions 탭에서 수동 실행 버튼도 사용 가능

permissions:
  contents: write   # 저장소에 결과 파일을 커밋하기 위해 필요

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 라이브러리 설치
        run: pip install -r requirements.txt

      - name: Chrome 설치
        uses: browser-actions/setup-chrome@v1

      - name: 스크립트 실행
        run: python andar_scrape.py

      - name: 결과 파일을 results 폴더로 정리
        run: |
          mkdir -p results
          mv andar_할인율모니터링_*.xlsx results/

      - name: 결과 파일 커밋 & 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add results/*.xlsx
          git commit -m "결과 파일 업데이트 $(date +'%Y-%m-%d')" || echo "변경사항 없음"
          git push
